<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кинобар — экран</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { --accent: #ffb400; --bg: #0d0d12; --fg: #f5f5f7; --muted: #a3a3b5; --dim: .55; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; cursor: none; }

  /* ---- layers: background media → particles → menu → promo ---- */
  #bg { position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 22%, transparent), transparent 65%); }
  #bg video, #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bg::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, var(--dim)); }
  #bg.empty::after { display: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #board { position: fixed; inset: 0; padding: 4vh 4vw; display: flex; flex-direction: column; }
  #promo { position: fixed; inset: 0; background: #000; opacity: 0; visibility: hidden; transition: opacity .8s, visibility 0s .8s; }
  #promo.show { opacity: 1; visibility: visible; transition: opacity .8s; }
  #promo video, #promo img { width: 100%; height: 100%; object-fit: contain; }

  #inner { font-size: var(--fs, 32px); display: flex; flex-direction: column; flex: 1; min-height: 0;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
  h1 { font-size: 2.6em; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05;
    margin-bottom: .45em; color: var(--accent); text-shadow: none;
    background: linear-gradient(100deg, var(--accent) 40%, #fff 50%, var(--accent) 60%) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 7s linear infinite; filter: drop-shadow(0 3px 10px rgba(0, 0, 0, .6)); }
  .cols { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 0 3em; align-content: start; }
  .cat { margin-bottom: 1em; }
  .cat h2 { font-size: 1.1em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border-bottom: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
    padding-bottom: .2em; margin-bottom: .4em; }

  /* list layout */
  .item { display: flex; align-items: center; gap: .5em; padding: .25em 0; }
  .item .pic { height: 1.7em; width: 1.7em; object-fit: contain; flex: none; filter: drop-shadow(0 .1em .2em rgba(0,0,0,.5)); }
  .name { font-weight: 600; white-space: nowrap; }
  .size { color: var(--muted); font-size: .75em; white-space: nowrap; }
  .dots { flex: 1; border-bottom: 2px dotted rgba(255, 255, 255, .25); min-width: 1em; align-self: center; }
  .price { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .old { color: var(--muted); text-decoration: line-through; font-size: .7em; margin-right: .4em; font-weight: 500; }
  .hit { background: var(--accent); color: #000; font-size: .55em; font-weight: 800; padding: .15em .45em; text-shadow: none;
    border-radius: .3em; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; animation: pulse 2.4s ease-in-out infinite; }
  .soldout { font-size: .6em; color: #ff6b6b; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
  .out { opacity: .35; }
  .out .price { text-decoration: line-through; }

  /* cards layout */
  .layout-cards .cat-items { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: .7em; }
  .layout-cards .cols { grid-template-columns: 1fr; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: .6em .5em .5em; border-radius: .6em; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(6px); }
  .card .pic { height: 4.2em; width: 100%; object-fit: contain; margin-bottom: .3em;
    filter: drop-shadow(0 .25em .35em rgba(0,0,0,.55)); animation: float 5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -.7s); }
  .card .name { white-space: normal; line-height: 1.15; }
  .card .size { margin-top: .15em; }
  .card .price { font-size: 1.3em; margin-top: auto; padding-top: .25em; color: var(--accent); }
  .card .hit { position: absolute; top: .5em; left: .5em; }
  .card .soldout { position: absolute; top: .6em; right: .5em; }

  /* animations */
  .enter .anim { animation: enter .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
  .enter h1 { animation: enter .7s cubic-bezier(.2, .8, .2, 1) both, shimmer 7s linear .7s infinite; }
  .flash { animation: flash 2.4s ease-out; }
  .measuring, .measuring * { animation: none !important; transition: none !important; }
  @keyframes enter { from { opacity: 0; transform: translateY(1.2em) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -200% 0; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-.25em) rotate(1.5deg); } }
  @keyframes flash { 0%, 40% { color: #fff; text-shadow: 0 0 .5em var(--accent), 0 0 1em var(--accent); } 100% { } }

  /* slides layout: designer pictures with live prices on top */
  #slides { position: fixed; inset: 0; display: none; background: #000; }
  .slides-mode #slides { display: block; }
  .slides-mode #board { display: none; }
  .slides-mode #fx { z-index: 2; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1s ease; }
  .slide.active { opacity: 1; z-index: 1; }
  .slide.fx-slide { transform: translateX(6%); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  .slide.fx-slide.active { transform: none; }
  .slide.fx-zoom { transform: scale(1.12); transition: opacity .9s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); }
  .slide.fx-zoom.active { transform: none; }
  .stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; container-type: size; }
  .stage .sbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .zoomer { position: absolute; inset: 0; transform-origin: 60% 50%; }
  .slide.active .zoomer.kb { animation: kb var(--dur, 10s) ease-out both; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.07); } }
  .label { position: absolute; white-space: pre; line-height: 1; font-size: calc(var(--size, 8) * 1cqh);
    transform: translate(var(--tx), -50%); transform-origin: var(--origin, center); }
  @keyframes lpulse { 0%, 100% { transform: translate(var(--tx), -50%) scale(1); } 50% { transform: translate(var(--tx), -50%) scale(1.07); } }
  .label.shadow { text-shadow: 0 .04em .12em rgba(0,0,0,.55); }
  .label.out { opacity: .45; text-decoration: line-through; }
  .slide.active .label { animation: pop .8s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i, 0) * 120ms + 400ms); }
  .slide.active .label.pulse { animation: pop .8s cubic-bezier(.2,1.4,.4,1) both calc(var(--i, 0) * 120ms + 400ms),
    lpulse 2.6s ease-in-out calc(var(--i, 0) * 120ms + 1.4s) infinite; }
  .label.flash { animation: flash 2.4s ease-out !important; }
  @keyframes pop { from { opacity: 0; transform: translate(var(--tx), -50%) scale(.6); } to { opacity: 1; transform: translate(var(--tx), -50%) scale(1); } }
  #status { position: fixed; right: 10px; bottom: 10px; width: 10px; height: 10px; border-radius: 50%;
    background: #e5484d; opacity: 0; transition: opacity .3s; }
  #status.offline { opacity: 1; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 4vh; color: var(--muted); text-align: center; padding: 5vw; }
</style>
</head>
<body>
<div id="bg" class="empty"></div>
<canvas id="fx"></canvas>
<div id="board"><div id="inner"></div></div>
<div id="slides"></div>
<div id="promo"></div>
<div id="status" title="Нет связи с сервером"></div>
<div id="error"></div>
<script src="/common.js"></script>
<script src="/effects.js"></script>
<script src="/slides.js"></script>
<script src="/screen.js"></script>
</body>
</html>
