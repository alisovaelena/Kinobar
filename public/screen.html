<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кинобар — экран</title>
<style>
  :root { --accent: #ffb400; --bg: #0d0d12; --fg: #f5f5f7; --muted: #8a8a99; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; cursor: none; }
  #board { width: 100vw; height: 100vh; padding: 4vh 4vw; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%); }
  #inner { font-size: var(--fs, 32px); display: flex; flex-direction: column; flex: 1; min-height: 0; }
  h1 { font-size: 2.6em; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    color: var(--accent); margin-bottom: .5em; line-height: 1; }
  .cols { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); column-gap: 3em; align-content: start; }
  .cat { break-inside: avoid; margin-bottom: 1em; }
  .cat h2 { font-size: 1.15em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border-bottom: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
    padding-bottom: .2em; margin-bottom: .4em; }
  .item { display: flex; align-items: baseline; gap: .5em; padding: .28em 0; }
  .name { font-weight: 600; white-space: nowrap; }
  .size { color: var(--muted); font-size: .75em; white-space: nowrap; }
  .dots { flex: 1; border-bottom: 2px dotted #3a3a48; transform: translateY(-.25em); min-width: 1em; }
  .price { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .old { color: var(--muted); text-decoration: line-through; font-size: .7em; margin-right: .4em; font-weight: 500; }
  .hit { background: var(--accent); color: #000; font-size: .55em; font-weight: 800; padding: .15em .45em;
    border-radius: .3em; text-transform: uppercase; letter-spacing: .05em; align-self: center; }
  .item.out { opacity: .35; }
  .item.out .price { text-decoration: line-through; }
  .soldout { font-size: .6em; color: #ff6b6b; text-transform: uppercase; font-weight: 700; align-self: center; }
  .flash { animation: flash 2s ease-out; }
  @keyframes flash { 0%, 40% { color: var(--accent); text-shadow: 0 0 .4em var(--accent); } 100% { text-shadow: none; } }
  #status { position: fixed; right: 10px; bottom: 10px; width: 10px; height: 10px; border-radius: 50%;
    background: #e5484d; opacity: 0; transition: opacity .3s; }
  #status.offline { opacity: 1; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 4vh; color: var(--muted); text-align: center; padding: 5vw; }
</style>
</head>
<body>
<div id="board"><div id="inner"></div></div>
<div id="status" title="Нет связи с сервером"></div>
<div id="error"></div>
<script src="/common.js"></script>
<script src="/screen.js"></script>
</body>
</html>
