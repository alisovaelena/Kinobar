<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кинобар — менеджер</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { --bg: #f4f4f6; --card: #fff; --fg: #1b1b1f; --muted: #6b6b76; --line: #e2e2e8; --accent: #e85d04; --ok: #2f9e44; --bad: #e03131; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 "Segoe UI", Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #1b1b1f; color: #fff; padding: 10px 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  #state { font-size: 13px; opacity: .85; }
  #state.dirty { color: #ffd43b; }
  #state.err { color: #ff8787; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--fg); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 8px 18px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.danger { color: var(--bad); }
  button.ghost { border-color: transparent; background: transparent; }
  nav { display: flex; gap: 6px; padding: 12px 16px 0; flex-wrap: wrap; }
  nav button.active { background: var(--fg); color: #fff; border-color: var(--fg); }
  main { padding: 12px 16px 60px; max-width: 1100px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label.f { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  input[type=text], input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.changed { background: #fff4e6; border-color: #ffa94d; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 4px; }
  td { padding: 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  td input[type=text] { width: 100%; }
  td input.price { width: 100px; text-align: right; font-weight: 700; font-size: 16px; }
  td input.old { width: 90px; text-align: right; }
  .cat-head { display: flex; gap: 8px; align-items: center; }
  .cat-head input { font-weight: 700; font-size: 16px; flex: 1; }
  .center { text-align: center; }
  .muted { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  details > summary { cursor: pointer; }
  .thumb { width: 56px; height: 42px; object-fit: cover; border-radius: 6px; background: #eceef2; display: inline-flex;
    align-items: center; justify-content: center; font-size: 11px; color: var(--muted); vertical-align: middle; }
  img.thumb[src$=".svg"] { object-fit: contain; background: #2b2b33; }
  .thumb-btn { padding: 2px; line-height: 0; }
  .thumb-btn.big .thumb { width: 160px; height: 90px; font-size: 13px; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .tile { display: flex; flex-direction: column; gap: 4px; align-items: stretch; text-align: center; font-size: 12px;
    padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow-wrap: anywhere; }
  .tile .thumb { width: 100%; height: 90px; }
  button.tile:hover { border-color: var(--accent); }
  .tile.upload { justify-content: center; min-height: 110px; font-weight: 600; color: var(--accent); border-style: dashed; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--bg); border-radius: 12px; padding: 16px; width: min(900px, 100%); max-height: 90vh; overflow: auto; }
  .ed-stage { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; overflow: hidden; container-type: size;
    background: #111; border-radius: 8px; margin-top: 8px; touch-action: none; user-select: none; }
  .ed-stage .sbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .ed-stage .empty-bg { display: flex; align-items: center; justify-content: center; color: #888; }
  .label { position: absolute; white-space: pre; line-height: 1; font-size: calc(var(--size, 8) * 1cqh);
    transform: translate(var(--tx), -50%); transform-origin: var(--origin, center); }
  .label.shadow { text-shadow: 0 .04em .12em rgba(0,0,0,.55); }
  .ed-label { cursor: grab; outline: 1px dashed rgba(255,255,255,.35); outline-offset: .1em; }
  .ed-label.selected { outline: 2px solid var(--accent); }
  .label-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b1b1f; color: #fff;
    padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 700px) {
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border-top: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    td { border: 0; padding: 0; }
    td.wide { grid-column: 1 / -1; }
    td input.price, td input.old { width: 100%; }
    td.center { text-align: left; }
    td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }
    td.center[data-label]::before { display: inline; margin-right: 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>🍿 Кинобар — цены</h1>
  <span id="state">Загрузка…</span>
  <button id="revert" class="ghost" style="color:#fff">Отменить</button>
  <button id="save" class="primary" disabled>Сохранить и показать на ТВ</button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="toast"></div>
<script src="/common.js"></script>
<script src="/slide-editor.js"></script>
<script src="/admin.js"></script>
</body>
</html>
